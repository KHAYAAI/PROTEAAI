# fly.toml app configuration file generated for proteaai-os on 2026-05-20T20:15:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'proteaai-os'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  JWT_EXPIRES_IN = '7d'
  NODE_ENV = 'production'
  PORT = '3001'
  PROTEAAI_DATA_DIR = '/data'

[[mounts]]
  source = 'proteaai_data'
  destination = '/data'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[checks]
  [checks.health]
    port = 3001
    type = 'http'
    interval = '30s'
    timeout = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
