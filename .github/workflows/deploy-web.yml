name: Deploy Web to Fly.io

on:
  push:
    branches: [main]

concurrency:
  group: deploy-web
  cancel-in-progress: false   # Never cancel a deploy mid-flight

jobs:
  validate:
    name: Pre-deploy validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TypeScript type check
        run: npm run ts

      - name: Lint / format check
        run: npm run presubmit

      - name: Unit tests
        run: npm run test

      - name: Build web client
        run: npm run build:web-client

      - name: Build web server
        run: npm run build:web-server

  deploy:
    name: Deploy to Fly.io
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify health check
        run: |
          echo "Waiting 15s for app to start..."
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://proteaai.fly.dev/health)
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed (HTTP $STATUS). Rolling back..."
            flyctl releases rollback
            exit 1
          fi
          echo "Health check passed (HTTP $STATUS)"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
